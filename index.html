<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>がいどん神経衰弱</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }
        .stats { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; color: #555; }
        
        /* 列数はJavaScriptで動的に変更します */
        .game-board {
            display: grid; gap: 10px; justify-content: center; margin: 0 auto;
        }
        .card { width: 80px; height: 100px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.5s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;
            background-color: white; border: 2px solid #ddd;
        }
        .card-back { background-color: #e0f2fe; }
        .card-back img { width: 80%; }
        .card-front { transform: rotateY(180deg); }
        .card-front img { width: 90%; }
        
        input, select { padding: 10px; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; border-radius: 5px; border: none; background-color: #3498db; color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🦷 キャラクター神経衰弱 🦷</h1>

    <!-- 1. スタート画面 -->
    <div id="startScreen" class="screen active">
        <p>名前と難易度を選んでスタート！</p>
        <input type="text" id="playerName" placeholder="あなたの名前" required><br>
        <select id="difficulty">
            <option value="easy">かんたん (6ペア・12枚)</option>
            <option value="normal" selected>ふつう (8ペア・16枚)</option>
            <option value="hard">むずかしい (15ペア・30枚)</option>
            <option value="max">全乗せMAX (20ペア・40枚)</option>
        </select><br>
        <button onclick="startGame()">スタート</button>
    </div>

    <!-- 2. ゲーム画面 -->
    <div id="gameScreen" class="screen">
        <div class="stats">
            プレイヤー: <span id="displayPlayer"></span> | タイム: <span id="time">0</span>秒
        </div>
        <div class="game-board" id="gameBoard"></div>
    </div>

    <!-- 3. 結果＆ランキング画面 -->
    <div id="endScreen" class="screen">
        <h2>🎉 クリア！ 🎉</h2>
        <p>タイム: <span id="finalTime"></span>秒</p>
        <p id="sendingMsg">ランキングデータを送信中...</p>
        
        <div id="rankingArea" style="margin-top: 20px; display: none;">
            <h3 id="rankingTitle">🏆 ランキング 🏆</h3>
            <ul id="rankingList" style="list-style: none; padding: 0;"></ul>
        </div>
        <button onclick="location.reload()">もう一度遊ぶ</button>
    </div>

    <script>
        // 🌟 新しく発行したGASのURLに貼り替えてください
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzrBNOTuG1XFN2VEbA31bgDNiWttLLjyuOoX35nh6GCXv1S_zQnYA78AQFCxL2RVi4qAA/exec';
        const logoImage = 'logo.png'; 

        let playerName = '';
        let currentLevel = '';
        let totalPairs = 8;
        let columns = 4; // グリッドの列数
        
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;
        let timer;
        let seconds = 0;

        function startGame() {
            const nameInput = document.getElementById('playerName').value;
            if (!nameInput) { alert('名前を入力してください！'); return; }
            
            playerName = nameInput;
            currentLevel = document.getElementById('difficulty').value;
            
            // 難易度設定
            if (currentLevel === 'easy') { totalPairs = 6; columns = 4; }
            else if (currentLevel === 'normal') { totalPairs = 8; columns = 4; }
            else if (currentLevel === 'hard') { totalPairs = 15; columns = 5; }
            else if (currentLevel === 'max') { totalPairs = 20; columns = 5; } // 40枚の最高難易度！

            document.getElementById('displayPlayer').textContent = playerName;
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            
            initGame();
        }

       function initGame() {
    // 🌟 ここで「1.png」〜「40.png」のファイル名配列を自動生成しています
    let allImages = [];
    for (let i = 1; i <= 40; i++) {
        allImages.push(`${i}.png`);
    }
    allImages.sort(() => 0.5 - Math.random());
    const selectedImages = allImages.slice(0, totalPairs);
            
            cards = [...selectedImages, ...selectedImages];
            cards.sort(() => 0.5 - Math.random());

            const board = document.getElementById('gameBoard');
            // 列数を動的に設定
            board.style.gridTemplateColumns = `repeat(${columns}, 80px)`;
            
            cards.forEach(imgSrc => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.image = imgSrc;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"><img src="${imgSrc}" alt="character"></div>
                        <div class="card-back"><img src="${logoImage}" alt="logo"></div>
                    </div>
                `;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });

            timer = setInterval(() => {
                seconds++;
                document.getElementById('time').textContent = seconds;
            }, 1000);
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            this.classList.add('flipped');
            if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; }
            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.image === secondCard.dataset.image;
            if (isMatch) {
                firstCard.removeEventListener('click', flipCard);
                secondCard.removeEventListener('click', flipCard);
                resetBoard();
                matchedPairs++;
                if (matchedPairs === totalPairs) gameClear();
            } else {
                lockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');
                    resetBoard();
                }, 1000);
            }
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function gameClear() {
            clearInterval(timer);
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('endScreen').classList.add('active');
            document.getElementById('finalTime').textContent = seconds;
            sendDataToGAS(playerName, seconds, currentLevel);
        }

        function sendDataToGAS(name, time, level) {
            if(GAS_URL === 'ここにGASのURLを貼り付けてください') {
                document.getElementById('sendingMsg').textContent = "※GASのURLが設定されていません"; return;
            }

            // 🌟 送信URLに「level」を追加
            const url = `${GAS_URL}?name=${encodeURIComponent(name)}&time=${time}&level=${level}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('sendingMsg').style.display = 'none';
                    const rankingArea = document.getElementById('rankingArea');
                    const rankingList = document.getElementById('rankingList');
                    
                    // 難易度名をランキングタイトルに反映
                    const levelNames = { 'easy': 'かんたん', 'normal': 'ふつう', 'hard': 'むずかしい', 'max': '全乗せMAX' };
                    document.getElementById('rankingTitle').textContent = `🏆 ランキング (${levelNames[level]}) 🏆`;
                    
                    rankingArea.style.display = 'block';
                    rankingList.innerHTML = ''; // リストを初期化
                    
                    if(data.ranking && data.ranking.length > 0) {
                        data.ranking.forEach((record, index) => {
                            const li = document.createElement('li');
                            li.textContent = `${index + 1}位: ${record.name} - ${record.time}秒`;
                            li.style.marginBottom = '5px';
                            rankingList.appendChild(li);
                        });
                    } else {
                        rankingList.innerHTML = '<li>まだ記録がありません。あなたが1位です！</li>';
                    }
                })
                .catch(error => {
                    document.getElementById('sendingMsg').textContent = "通信エラーが発生しました";
                    console.error("Error:", error);
                });
        }
    </script>
</body>
</html>
